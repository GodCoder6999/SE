<svg xmlns="http://www.w3.org/2000/svg" width="980" height="660" viewBox="0 0 980 660" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#455A64"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="980" height="660" fill="#FFFFFF"/>
  <rect x="0" y="0" width="980" height="52" fill="#5E35B1"/>
  <text x="490" y="33" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="bold">DFD Level 0 - Context Diagram : Library Management System</text>

  <!-- External entities -->
  <rect x="40" y="90" width="160" height="72" fill="#E3F2FD" stroke="#1976D2" stroke-width="2"/>
  <text x="120" y="132" text-anchor="middle" font-size="16" font-weight="bold" fill="#0D47A1">Member</text>
  <rect x="40" y="500" width="160" height="72" fill="#E3F2FD" stroke="#1976D2" stroke-width="2"/>
  <text x="120" y="542" text-anchor="middle" font-size="16" font-weight="bold" fill="#0D47A1">Librarian</text>
  <rect x="780" y="289" width="160" height="72" fill="#E3F2FD" stroke="#1976D2" stroke-width="2"/>
  <text x="860" y="331" text-anchor="middle" font-size="16" font-weight="bold" fill="#0D47A1">Supplier</text>

  <!-- Central process -->
  <circle cx="485" cy="325" r="95" fill="#EDE7F6" stroke="#5E35B1" stroke-width="2.5"/>
  <text x="485" y="303" text-anchor="middle" font-size="15" font-weight="bold" fill="#4527A0">0</text>
  <text x="485" y="326" text-anchor="middle" font-size="15" font-weight="bold" fill="#4527A0">Library</text>
  <text x="485" y="348" text-anchor="middle" font-size="15" font-weight="bold" fill="#4527A0">Management System</text>

  <!-- Member flows -->
  <line x1="200" y1="120" x2="395" y2="275" stroke="#455A64" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="228" y="182" font-size="12.5" fill="#37474F">Search / borrow / return request</text>
  <line x1="405" y1="290" x2="205" y2="150" stroke="#455A64" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="208" y="252" font-size="12.5" fill="#37474F">Book status / issue slip / fine</text>

  <!-- Librarian flows -->
  <line x1="200" y1="515" x2="398" y2="368" stroke="#455A64" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="222" y="470" font-size="12.5" fill="#37474F">Manage books &amp; members</text>
  <line x1="405" y1="385" x2="205" y2="528" stroke="#455A64" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="222" y="408" font-size="12.5" fill="#37474F">Reports &amp; records</text>

  <!-- Supplier flows -->
  <line x1="780" y1="312" x2="582" y2="316" stroke="#455A64" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="612" y="304" font-size="12.5" fill="#37474F">Book supply</text>
  <line x1="582" y1="336" x2="780" y2="340" stroke="#455A64" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="612" y="358" font-size="12.5" fill="#37474F">Purchase order</text>

  <!-- Legend -->
  <rect x="40" y="600" width="26" height="18" fill="#E3F2FD" stroke="#1976D2"/>
  <text x="74" y="614" font-size="12.5" fill="#37474F">External Entity</text>
  <circle cx="223" cy="609" r="10" fill="#EDE7F6" stroke="#5E35B1"/>
  <text x="240" y="614" font-size="12.5" fill="#37474F">Process</text>
</svg>
