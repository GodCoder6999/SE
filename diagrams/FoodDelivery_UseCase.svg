<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="950" viewBox="0 0 1240 950" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="open" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4 L0,8" fill="none" stroke="#6A1B9A" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1240" height="950" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1240" height="52" fill="#5E35B1"/>
  <text x="620" y="33" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="bold">Use Case Diagram : Online Food Delivery System</text>

  <!-- System boundary -->
  <rect x="330" y="90" width="560" height="720" rx="6" fill="#FAFAFF" stroke="#5E35B1" stroke-width="2"/>
  <text x="610" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#4527A0">Online Food Delivery System</text>

  <!-- ===================== ACTORS ===================== -->
  <!-- Customer -->
  <g stroke="#37474F" stroke-width="2" fill="none">
    <circle cx="150" cy="362" r="12" fill="#ECEFF1"/>
    <line x1="150" y1="374" x2="150" y2="404"/>
    <line x1="132" y1="386" x2="168" y2="386"/>
    <line x1="150" y1="404" x2="136" y2="428"/>
    <line x1="150" y1="404" x2="164" y2="428"/>
  </g>
  <text x="150" y="448" text-anchor="middle" font-size="14" font-weight="bold" fill="#263238">Customer</text>

  <!-- Restaurant -->
  <g stroke="#37474F" stroke-width="2" fill="none">
    <circle cx="1080" cy="162" r="12" fill="#ECEFF1"/>
    <line x1="1080" y1="174" x2="1080" y2="204"/>
    <line x1="1062" y1="186" x2="1098" y2="186"/>
    <line x1="1080" y1="204" x2="1066" y2="228"/>
    <line x1="1080" y1="204" x2="1094" y2="228"/>
  </g>
  <text x="1080" y="248" text-anchor="middle" font-size="14" font-weight="bold" fill="#263238">Restaurant</text>

  <!-- Delivery Agent -->
  <g stroke="#37474F" stroke-width="2" fill="none">
    <circle cx="1080" cy="442" r="12" fill="#ECEFF1"/>
    <line x1="1080" y1="454" x2="1080" y2="484"/>
    <line x1="1062" y1="466" x2="1098" y2="466"/>
    <line x1="1080" y1="484" x2="1066" y2="508"/>
    <line x1="1080" y1="484" x2="1094" y2="508"/>
  </g>
  <text x="1080" y="528" text-anchor="middle" font-size="14" font-weight="bold" fill="#263238">Delivery Agent</text>

  <!-- Payment Gateway (secondary / external) -->
  <g stroke="#37474F" stroke-width="2" fill="none">
    <circle cx="620" cy="846" r="12" fill="#ECEFF1"/>
    <line x1="620" y1="858" x2="620" y2="888"/>
    <line x1="602" y1="870" x2="638" y2="870"/>
    <line x1="620" y1="888" x2="606" y2="912"/>
    <line x1="620" y1="888" x2="634" y2="912"/>
  </g>
  <text x="620" y="932" text-anchor="middle" font-size="14" font-weight="bold" fill="#263238">Payment Gateway «external»</text>

  <!-- ===================== ASSOCIATIONS (solid) ===================== -->
  <g stroke="#455A64" stroke-width="1.4">
    <!-- Customer -> use cases -->
    <line x1="172" y1="392" x2="402" y2="160"/>
    <line x1="172" y1="392" x2="402" y2="250"/>
    <line x1="172" y1="396" x2="402" y2="400"/>
    <line x1="172" y1="398" x2="402" y2="600"/>
    <line x1="172" y1="400" x2="402" y2="690"/>
    <line x1="172" y1="402" x2="402" y2="770"/>
    <line x1="172" y1="396" x2="542" y2="500"/>
    <line x1="172" y1="394" x2="572" y2="340"/>
    <!-- Restaurant -> use cases -->
    <line x1="1058" y1="188" x2="848" y2="175"/>
    <line x1="1058" y1="190" x2="848" y2="270"/>
    <line x1="1058" y1="192" x2="848" y2="365"/>
    <!-- Delivery Agent -> use cases -->
    <line x1="1058" y1="468" x2="848" y2="505"/>
    <line x1="1058" y1="470" x2="848" y2="600"/>
    <!-- Payment Gateway -> Make Payment -->
    <line x1="620" y1="834" x2="628" y2="533"/>
  </g>

  <!-- ===================== USE CASES (ovals) ===================== -->
  <g font-size="12.5" font-weight="bold" fill="#4527A0" text-anchor="middle">
    <ellipse cx="490" cy="160" rx="88" ry="33" fill="#EDE7F6" stroke="#5E35B1" stroke-width="1.8"/>
    <text x="490" y="165">Register / Login</text>

    <ellipse cx="490" cy="250" rx="88" ry="33" fill="#EDE7F6" stroke="#5E35B1" stroke-width="1.8"/>
    <text x="490" y="246">Search &amp;</text><text x="490" y="263">Browse Menu</text>

    <ellipse cx="490" cy="400" rx="88" ry="33" fill="#EDE7F6" stroke="#5E35B1" stroke-width="1.8"/>
    <text x="490" y="405">Place Order</text>

    <ellipse cx="490" cy="600" rx="88" ry="33" fill="#EDE7F6" stroke="#5E35B1" stroke-width="1.8"/>
    <text x="490" y="605">Track Order</text>

    <ellipse cx="490" cy="690" rx="88" ry="33" fill="#EDE7F6" stroke="#5E35B1" stroke-width="1.8"/>
    <text x="490" y="695">Rate &amp; Review</text>

    <ellipse cx="490" cy="770" rx="88" ry="33" fill="#EDE7F6" stroke="#5E35B1" stroke-width="1.8"/>
    <text x="490" y="775">Cancel Order</text>

    <ellipse cx="630" cy="500" rx="88" ry="33" fill="#EDE7F6" stroke="#5E35B1" stroke-width="1.8"/>
    <text x="630" y="505">Make Payment</text>

    <ellipse cx="660" cy="340" rx="80" ry="31" fill="#F3E5F5" stroke="#8E24AA" stroke-width="1.6"/>
    <text x="660" y="345">Apply Coupon</text>

    <ellipse cx="760" cy="175" rx="88" ry="33" fill="#EDE7F6" stroke="#5E35B1" stroke-width="1.8"/>
    <text x="760" y="180">Manage Menu</text>

    <ellipse cx="760" cy="270" rx="88" ry="33" fill="#EDE7F6" stroke="#5E35B1" stroke-width="1.8"/>
    <text x="760" y="266">Accept /</text><text x="760" y="283">Reject Order</text>

    <ellipse cx="760" cy="365" rx="88" ry="33" fill="#EDE7F6" stroke="#5E35B1" stroke-width="1.8"/>
    <text x="760" y="361">Update Food</text><text x="760" y="378">Status</text>

    <ellipse cx="760" cy="505" rx="88" ry="33" fill="#EDE7F6" stroke="#5E35B1" stroke-width="1.8"/>
    <text x="760" y="501">View Assigned</text><text x="760" y="518">Orders</text>

    <ellipse cx="760" cy="600" rx="88" ry="33" fill="#EDE7F6" stroke="#5E35B1" stroke-width="1.8"/>
    <text x="760" y="596">Update Delivery</text><text x="760" y="613">Status</text>
  </g>

  <!-- ===================== INCLUDE / EXTEND (dashed) ===================== -->
  <!-- Place Order «include» Make Payment -->
  <line x1="548" y1="430" x2="582" y2="474" stroke="#6A1B9A" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#open)"/>
  <text x="520" y="462" font-size="11.5" font-style="italic" fill="#6A1B9A">«include»</text>

  <!-- Apply Coupon «extend» Place Order -->
  <line x1="588" y1="360" x2="540" y2="388" stroke="#6A1B9A" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#open)"/>
  <text x="548" y="352" font-size="11.5" font-style="italic" fill="#6A1B9A">«extend»</text>

  <!-- ===================== LEGEND ===================== -->
  <g stroke="#37474F" stroke-width="1.6" fill="none">
    <circle cx="44" cy="862" r="7" fill="#ECEFF1"/>
    <line x1="44" y1="869" x2="44" y2="884"/><line x1="35" y1="874" x2="53" y2="874"/>
    <line x1="44" y1="884" x2="37" y2="896"/><line x1="44" y1="884" x2="51" y2="896"/>
  </g>
  <text x="64" y="882" font-size="12" fill="#37474F">Actor</text>
  <ellipse cx="150" cy="876" rx="34" ry="15" fill="#EDE7F6" stroke="#5E35B1"/>
  <text x="150" y="880" text-anchor="middle" font-size="11" fill="#4527A0">Use Case</text>
  <line x1="210" y1="876" x2="270" y2="876" stroke="#455A64" stroke-width="1.4"/>
  <text x="278" y="880" font-size="12" fill="#37474F">Association</text>
  <line x1="380" y1="876" x2="440" y2="876" stroke="#6A1B9A" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#open)"/>
  <text x="450" y="880" font-size="12" fill="#37474F">«include» / «extend»</text>
</svg>
