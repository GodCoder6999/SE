<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="720" viewBox="0 0 1180 720" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#455A64"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1180" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1180" height="52" fill="#5E35B1"/>
  <text x="590" y="33" text-anchor="middle" fill="#FFFFFF" font-size="21" font-weight="bold">DFD Level 2 : Explosion of Process 2.0 - Place Order &amp; Browse Menu</text>

  <!-- External entities -->
  <rect x="30" y="270" width="130" height="80" fill="#E3F2FD" stroke="#1976D2" stroke-width="2"/>
  <text x="95" y="316" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D47A1">Customer</text>

  <!-- duplicate customer (marked with corner slash) -->
  <rect x="480" y="560" width="130" height="76" fill="#E3F2FD" stroke="#1976D2" stroke-width="2"/>
  <line x1="480" y1="560" x2="494" y2="574" stroke="#1976D2" stroke-width="2"/>
  <text x="545" y="603" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D47A1">Customer</text>

  <rect x="800" y="70" width="150" height="64" fill="#E3F2FD" stroke="#1976D2" stroke-width="2"/>
  <text x="875" y="108" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D47A1">Restaurant</text>

  <!-- boundary process 3.0 -->
  <circle cx="1075" cy="195" r="52" fill="#F3E5F5" stroke="#8E24AA" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="1075" y="190" text-anchor="middle" font-size="12" font-weight="bold" fill="#6A1B9A">3.0</text>
  <text x="1075" y="207" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#6A1B9A">Payment</text>

  <!-- Sub-processes (circles) -->
  <circle cx="280" cy="165" r="58" fill="#EDE7F6" stroke="#5E35B1" stroke-width="2.2"/>
  <text x="280" y="152" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4527A0">2.1</text>
  <text x="280" y="171" text-anchor="middle" font-size="12" font-weight="bold" fill="#4527A0">Search</text>
  <text x="280" y="188" text-anchor="middle" font-size="12" font-weight="bold" fill="#4527A0">Restaurants</text>

  <circle cx="280" cy="430" r="58" fill="#EDE7F6" stroke="#5E35B1" stroke-width="2.2"/>
  <text x="280" y="424" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4527A0">2.2</text>
  <text x="280" y="443" text-anchor="middle" font-size="12" font-weight="bold" fill="#4527A0">View Menu</text>

  <circle cx="615" cy="320" r="60" fill="#EDE7F6" stroke="#5E35B1" stroke-width="2.2"/>
  <text x="615" y="314" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4527A0">2.3</text>
  <text x="615" y="333" text-anchor="middle" font-size="12" font-weight="bold" fill="#4527A0">Manage Cart</text>

  <circle cx="885" cy="195" r="60" fill="#EDE7F6" stroke="#5E35B1" stroke-width="2.2"/>
  <text x="885" y="182" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4527A0">2.4</text>
  <text x="885" y="201" text-anchor="middle" font-size="12" font-weight="bold" fill="#4527A0">Confirm &amp;</text>
  <text x="885" y="217" text-anchor="middle" font-size="12" font-weight="bold" fill="#4527A0">Submit Order</text>

  <!-- Data stores -->
  <g stroke="#F9A825" stroke-width="2">
    <line x1="430" y1="40" x2="620" y2="40"/><line x1="430" y1="82" x2="620" y2="82"/>
    <line x1="430" y1="40" x2="430" y2="82"/><line x1="462" y1="40" x2="462" y2="82"/>
  </g>
  <text x="446" y="66" text-anchor="middle" font-size="12" font-weight="bold" fill="#E65100">D2</text>
  <text x="543" y="66" text-anchor="middle" font-size="13" fill="#E65100">Menu DB</text>

  <g stroke="#F9A825" stroke-width="2">
    <line x1="790" y1="540" x2="990" y2="540"/><line x1="790" y1="582" x2="990" y2="582"/>
    <line x1="790" y1="540" x2="790" y2="582"/><line x1="822" y1="540" x2="822" y2="582"/>
  </g>
  <text x="806" y="566" text-anchor="middle" font-size="12" font-weight="bold" fill="#E65100">D3</text>
  <text x="908" y="566" text-anchor="middle" font-size="13" fill="#E65100">Order DB</text>

  <!-- Flows: Customer(L) <-> 2.1 -->
  <line x1="160" y1="295" x2="238" y2="196" stroke="#455A64" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="120" y="248" font-size="11.5" fill="#37474F">Search food</text>
  <line x1="230" y1="205" x2="165" y2="305" stroke="#455A64" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="150" y="272" font-size="11.5" fill="#37474F">Restaurant list</text>

  <!-- 2.1 <-> D2 -->
  <line x1="331" y1="138" x2="470" y2="70" stroke="#455A64" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="360" y="104" font-size="11.5" fill="#37474F">Search query</text>
  <line x1="462" y1="76" x2="338" y2="145" stroke="#455A64" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="352" y="140" font-size="11.5" fill="#37474F">Results</text>

  <!-- Customer(L) <-> 2.2 -->
  <line x1="160" y1="325" x2="235" y2="392" stroke="#455A64" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="118" y="360" font-size="11.5" fill="#37474F">Select restaurant</text>
  <line x1="228" y1="404" x2="165" y2="338" stroke="#455A64" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="150" y="392" font-size="11.5" fill="#37474F">Menu items</text>

  <!-- 2.2 <-> D2 -->
  <line x1="318" y1="382" x2="474" y2="88" stroke="#455A64" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="410" y="250" font-size="11.5" fill="#37474F">Menu query</text>
  <line x1="466" y1="92" x2="326" y2="386" stroke="#455A64" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="345" y="250" font-size="11.5" fill="#37474F">Menu data</text>

  <!-- 2.2 -> 2.3 -->
  <line x1="335" y1="412" x2="558" y2="339" stroke="#455A64" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="400" y="398" font-size="11.5" fill="#37474F">Selected items</text>

  <!-- Customer(R) <-> 2.3 -->
  <line x1="555" y1="560" x2="604" y2="382" stroke="#455A64" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="452" y="470" font-size="11.5" fill="#37474F">Add / remove item</text>
  <line x1="625" y1="382" x2="560" y2="560" stroke="#455A64" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="628" y="470" font-size="11.5" fill="#37474F">Cart summary</text>

  <!-- 2.3 -> 2.4 -->
  <line x1="670" y1="295" x2="830" y2="220" stroke="#455A64" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="700" y="245" font-size="11.5" fill="#37474F">Checkout</text>

  <!-- Customer(R) <-> 2.4 -->
  <line x1="562" y1="562" x2="852" y2="246" stroke="#455A64" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="680" y="430" font-size="11.5" fill="#37474F">Confirm order</text>
  <line x1="842" y1="252" x2="556" y2="562" stroke="#455A64" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="640" y="405" font-size="11.5" fill="#37474F">Order confirmation</text>

  <!-- 2.4 -> D3 -->
  <line x1="885" y1="255" x2="888" y2="538" stroke="#455A64" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="892" y="400" font-size="11.5" fill="#37474F">Save order</text>

  <!-- 2.4 -> Restaurant -->
  <line x1="883" y1="136" x2="881" y2="136" stroke="#455A64" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="895" y1="138" x2="890" y2="135" stroke="#455A64" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="900" y="120" font-size="11.5" fill="#37474F">New order</text>

  <!-- 2.4 -> 3.0 -->
  <line x1="945" y1="195" x2="1020" y2="195" stroke="#455A64" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="948" y="185" font-size="11.5" fill="#37474F">Order amount</text>

  <!-- Legend -->
  <rect x="30" y="662" width="26" height="18" fill="#E3F2FD" stroke="#1976D2"/>
  <text x="64" y="676" font-size="12" fill="#37474F">External Entity</text>
  <circle cx="205" cy="671" r="10" fill="#EDE7F6" stroke="#5E35B1"/>
  <text x="222" y="676" font-size="12" fill="#37474F">Process</text>
  <g stroke="#F9A825" stroke-width="2">
    <line x1="310" y1="662" x2="350" y2="662"/><line x1="310" y1="680" x2="350" y2="680"/>
    <line x1="310" y1="662" x2="310" y2="680"/><line x1="320" y1="662" x2="320" y2="680"/>
  </g>
  <text x="358" y="676" font-size="12" fill="#37474F">Data Store</text>
  <circle cx="470" cy="671" r="10" fill="#F3E5F5" stroke="#8E24AA" stroke-dasharray="4,3"/>
  <text x="487" y="676" font-size="12" fill="#37474F">Process from parent level (boundary)</text>
  <text x="720" y="676" font-size="12" fill="#37474F">Corner slash = duplicated entity</text>
</svg>
