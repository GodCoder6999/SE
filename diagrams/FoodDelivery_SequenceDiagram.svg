<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="760" viewBox="0 0 1160 760" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="1160" height="760" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1160" height="50" fill="#5E35B1"/>
  <text x="580" y="32" text-anchor="middle" fill="#FFFFFF" font-size="21" font-weight="bold">Sequence Diagram : Place Order – Online Food Delivery System</text>

  <!-- ========== LIFELINES (dashed) ========== -->
  <line x1="100" y1="96" x2="100" y2="690" stroke="#90A4AE" stroke-width="1.3" stroke-dasharray="6,5"/>
  <line x1="340" y1="96" x2="340" y2="690" stroke="#90A4AE" stroke-width="1.3" stroke-dasharray="6,5"/>
  <line x1="580" y1="96" x2="580" y2="690" stroke="#90A4AE" stroke-width="1.3" stroke-dasharray="6,5"/>
  <line x1="810" y1="96" x2="810" y2="690" stroke="#90A4AE" stroke-width="1.3" stroke-dasharray="6,5"/>
  <line x1="1030" y1="96" x2="1030" y2="690" stroke="#90A4AE" stroke-width="1.3" stroke-dasharray="6,5"/>

  <!-- ========== ACTIVATION BARS ========== -->
  <rect x="335" y="135" width="10" height="495" fill="#EDE7F6" stroke="#5E35B1" stroke-width="1.2"/>
  <rect x="575" y="183" width="10" height="44" fill="#EDE7F6" stroke="#5E35B1" stroke-width="1.2"/>
  <rect x="575" y="438" width="10" height="44" fill="#EDE7F6" stroke="#5E35B1" stroke-width="1.2"/>
  <rect x="805" y="356" width="10" height="44" fill="#EDE7F6" stroke="#5E35B1" stroke-width="1.2"/>
  <rect x="1025" y="520" width="10" height="44" fill="#EDE7F6" stroke="#5E35B1" stroke-width="1.2"/>

  <!-- ========== HEADER BOXES ========== -->
  <rect x="30" y="60" width="140" height="36" fill="#E3F2FD" stroke="#1976D2" stroke-width="2"/>
  <text x="100" y="83" text-anchor="middle" font-size="13" font-weight="bold" fill="#0D47A1">Customer</text>
  <rect x="255" y="60" width="170" height="36" fill="#EDE7F6" stroke="#5E35B1" stroke-width="2"/>
  <text x="340" y="83" text-anchor="middle" font-size="13" font-weight="bold" fill="#4527A0">:FoodDeliveryApp</text>
  <rect x="505" y="60" width="150" height="36" fill="#EDE7F6" stroke="#5E35B1" stroke-width="2"/>
  <text x="580" y="83" text-anchor="middle" font-size="13" font-weight="bold" fill="#4527A0">:Restaurant</text>
  <rect x="722" y="60" width="176" height="36" fill="#EDE7F6" stroke="#5E35B1" stroke-width="2"/>
  <text x="810" y="83" text-anchor="middle" font-size="13" font-weight="bold" fill="#4527A0">:PaymentGateway</text>
  <rect x="950" y="60" width="160" height="36" fill="#EDE7F6" stroke="#5E35B1" stroke-width="2"/>
  <text x="1030" y="83" text-anchor="middle" font-size="13" font-weight="bold" fill="#4527A0">:DeliveryAgent</text>

  <!-- ========== MESSAGES (arrowheads drawn as real shapes) ========== -->
  <!-- 1 browseMenu  (right, solid) -->
  <line x1="100" y1="140" x2="335" y2="140" stroke="#455A64" stroke-width="1.5"/>
  <polygon points="335,140 324,135 324,145" fill="#455A64"/>
  <text x="112" y="134" font-size="11.5" fill="#263238">1 : browseMenu()</text>

  <!-- 2 getMenu (right, solid) -->
  <line x1="345" y1="185" x2="575" y2="185" stroke="#455A64" stroke-width="1.5"/>
  <polygon points="575,185 564,180 564,190" fill="#455A64"/>
  <text x="356" y="179" font-size="11.5" fill="#263238">2 : getMenu()</text>

  <!-- 3 menu list (left, open return) -->
  <line x1="575" y1="223" x2="345" y2="223" stroke="#455A64" stroke-width="1.3" stroke-dasharray="6,4"/>
  <polyline points="356,218 345,223 356,228" fill="none" stroke="#455A64" stroke-width="1.3"/>
  <text x="400" y="217" font-size="11.5" fill="#607D8B">3 : menu list</text>

  <!-- 4 display menu (left, open return) -->
  <line x1="335" y1="261" x2="105" y2="261" stroke="#455A64" stroke-width="1.3" stroke-dasharray="6,4"/>
  <polyline points="116,256 105,261 116,266" fill="none" stroke="#455A64" stroke-width="1.3"/>
  <text x="140" y="255" font-size="11.5" fill="#607D8B">4 : display menu</text>

  <!-- 5 placeOrder (right, solid) -->
  <line x1="100" y1="315" x2="335" y2="315" stroke="#455A64" stroke-width="1.5"/>
  <polygon points="335,315 324,310 324,320" fill="#455A64"/>
  <text x="112" y="309" font-size="11.5" fill="#263238">5 : placeOrder(items)</text>

  <!-- 6 processPayment (right, solid) -->
  <line x1="345" y1="358" x2="805" y2="358" stroke="#455A64" stroke-width="1.5"/>
  <polygon points="805,358 794,353 794,363" fill="#455A64"/>
  <text x="440" y="352" font-size="11.5" fill="#263238">6 : processPayment(amount)</text>

  <!-- 7 paymentSuccess (left, open return) -->
  <line x1="805" y1="396" x2="345" y2="396" stroke="#455A64" stroke-width="1.3" stroke-dasharray="6,4"/>
  <polyline points="356,391 345,396 356,401" fill="none" stroke="#455A64" stroke-width="1.3"/>
  <text x="470" y="390" font-size="11.5" fill="#607D8B">7 : paymentSuccess</text>

  <!-- 8 confirmOrder (right, solid) -->
  <line x1="345" y1="440" x2="575" y2="440" stroke="#455A64" stroke-width="1.5"/>
  <polygon points="575,440 564,435 564,445" fill="#455A64"/>
  <text x="356" y="434" font-size="11.5" fill="#263238">8 : confirmOrder()</text>

  <!-- 9 orderAccepted (left, open return) -->
  <line x1="575" y1="478" x2="345" y2="478" stroke="#455A64" stroke-width="1.3" stroke-dasharray="6,4"/>
  <polyline points="356,473 345,478 356,483" fill="none" stroke="#455A64" stroke-width="1.3"/>
  <text x="398" y="472" font-size="11.5" fill="#607D8B">9 : orderAccepted</text>

  <!-- 10 assignDelivery (right, solid) -->
  <line x1="345" y1="522" x2="1025" y2="522" stroke="#455A64" stroke-width="1.5"/>
  <polygon points="1025,522 1014,517 1014,527" fill="#455A64"/>
  <text x="560" y="516" font-size="11.5" fill="#263238">10 : assignDelivery()</text>

  <!-- 11 outForDelivery (left, open return) -->
  <line x1="1025" y1="560" x2="345" y2="560" stroke="#455A64" stroke-width="1.3" stroke-dasharray="6,4"/>
  <polyline points="356,555 345,560 356,565" fill="none" stroke="#455A64" stroke-width="1.3"/>
  <text x="560" y="554" font-size="11.5" fill="#607D8B">11 : outForDelivery</text>

  <!-- 12 orderConfirmed (left, open return) -->
  <line x1="335" y1="610" x2="105" y2="610" stroke="#455A64" stroke-width="1.3" stroke-dasharray="6,4"/>
  <polyline points="116,605 105,610 116,615" fill="none" stroke="#455A64" stroke-width="1.3"/>
  <text x="120" y="604" font-size="11.5" fill="#607D8B">12 : orderConfirmed + tracking</text>

  <!-- ========== LEGEND ========== -->
  <line x1="40" y1="712" x2="92" y2="712" stroke="#455A64" stroke-width="1.5"/>
  <polygon points="92,712 81,707 81,717" fill="#455A64"/>
  <text x="104" y="716" font-size="11.5" fill="#37474F">Synchronous message (call)</text>
  <line x1="320" y1="712" x2="372" y2="712" stroke="#455A64" stroke-width="1.3" stroke-dasharray="6,4"/>
  <polyline points="361,707 372,712 361,717" fill="none" stroke="#455A64" stroke-width="1.3"/>
  <text x="384" y="716" font-size="11.5" fill="#37474F">Return / reply</text>
  <rect x="540" y="705" width="10" height="16" fill="#EDE7F6" stroke="#5E35B1" stroke-width="1.2"/>
  <text x="560" y="716" font-size="11.5" fill="#37474F">Activation bar (object is active)</text>
  <line x1="820" y1="705" x2="820" y2="721" stroke="#90A4AE" stroke-width="1.3" stroke-dasharray="6,5"/>
  <text x="834" y="716" font-size="11.5" fill="#37474F">Lifeline (object over time)</text>
</svg>
