  <line x1="990" y1="386" x2="919" y2="390" stroke="#455A64" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="902" y="412" font-size="11.5" fill="#37474F">Delivery status</text>

  <path d="M 800 405 Q 420 570 165 408" fill="none" stroke="#455A64" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="330" y="548" font-size="12" fill="#37474F">Order tracking / delivery status</text>

  <!-- Legend -->
  <rect x="30" y="742" width="26" height="18" fill="#E3F2FD" stroke="#1976D2"/>
  <text x="64" y="756" font-size="12.5" fill="#37474F">External Entity</text>
  <circle cx="213" cy="751" r="10" fill="#EDE7F6" stroke="#5E35B1"/>
  <text x="230" y="756" font-size="12.5" fill="#37474F">Process</text>
  <g stroke="#F9A825" stroke-width="2">
    <line x1="320" y1="742" x2="360" y2="742"/><line x1="320" y1="760" x2="360" y2="760"/>
    <line x1="320" y1="742" x2="320" y2="760"/><line x1="330" y1="742" x2="330" y2="760"/>
  </g>
  <text x="368" y="756" font-size="12.5" fill="#37474F">Data Store</text>
