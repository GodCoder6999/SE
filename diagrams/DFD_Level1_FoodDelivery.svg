  <line x1="500" y1="600" x2="452" y2="638" stroke="#455A64" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="360" y="600" font-size="11.5" fill="#37474F">Txn record</text>

  <line x1="608" y1="555" x2="800" y2="408" stroke="#455A64" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="650" y="505" font-size="12" fill="#37474F">Paid order</text>

  <line x1="830" y1="437" x2="835" y2="530" stroke="#455A64" stroke-width="1.6" marker-end="url(#arrow)"/>
