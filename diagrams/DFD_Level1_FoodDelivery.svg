<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="800" viewBox="0 0 1160 800" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#455A64"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1160" height="800" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1160" height="52" fill="#5E35B1"/>
  <text x="580" y="33" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="bold">DFD Level 1 : Online Food Delivery System</text>

  <!-- External entities (rectangles) -->
  <rect x="30" y="360" width="140" height="72" fill="#E3F2FD" stroke="#1976D2" stroke-width="2"/>
  <text x="100" y="402" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D47A1">Customer</text>
  <rect x="470" y="120" width="150" height="66" fill="#E3F2FD" stroke="#1976D2" stroke-width="2"/>
  <text x="545" y="159" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D47A1">Restaurant</text>
  <rect x="990" y="330" width="140" height="72" fill="#E3F2FD" stroke="#1976D2" stroke-width="2"/>
  <text x="1060" y="360" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D47A1">Delivery</text>
  <text x="1060" y="380" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D47A1">Agent</text>
  <rect x="470" y="700" width="150" height="66" fill="#E3F2FD" stroke="#1976D2" stroke-width="2"/>
