  <text x="545" y="750" text-anchor="middle" font-size="14" font-weight="bold" fill="#0D47A1">Gateway</text>

  <!-- Processes (CIRCLES / bubbles) -->
  <circle cx="325" cy="155" r="60" fill="#EDE7F6" stroke="#5E35B1" stroke-width="2.2"/>
  <text x="325" y="140" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4527A0">1.0</text>
  <text x="325" y="160" text-anchor="middle" font-size="13" font-weight="bold" fill="#4527A0">Register /</text>
  <text x="325" y="178" text-anchor="middle" font-size="13" font-weight="bold" fill="#4527A0">Login</text>

  <circle cx="550" cy="375" r="66" fill="#EDE7F6" stroke="#5E35B1" stroke-width="2.2"/>
  <text x="550" y="358" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4527A0">2.0</text>
  <text x="550" y="378" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4527A0">Place Order &amp;</text>
  <text x="550" y="396" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4527A0">Browse Menu</text>

  <circle cx="550" cy="575" r="60" fill="#EDE7F6" stroke="#5E35B1" stroke-width="2.2"/>
  <text x="550" y="560" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4527A0">3.0</text>
  <text x="550" y="580" text-anchor="middle" font-size="13" font-weight="bold" fill="#4527A0">Process</text>
  <text x="550" y="598" text-anchor="middle" font-size="13" font-weight="bold" fill="#4527A0">Payment</text>

  <circle cx="855" cy="375" r="62" fill="#EDE7F6" stroke="#5E35B1" stroke-width="2.2"/>
