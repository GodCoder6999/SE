  <text x="818" y="556" text-anchor="middle" font-size="13" fill="#E65100">Order DB</text>

  <g stroke="#F9A825" stroke-width="2">
    <line x1="245" y1="620" x2="450" y2="620"/><line x1="245" y1="662" x2="450" y2="662"/>
    <line x1="245" y1="620" x2="245" y2="662"/><line x1="277" y1="620" x2="277" y2="662"/>
  </g>
  <text x="261" y="646" text-anchor="middle" font-size="12" font-weight="bold" fill="#E65100">D4</text>
  <text x="365" y="646" text-anchor="middle" font-size="13" fill="#E65100">Payment DB</text>

