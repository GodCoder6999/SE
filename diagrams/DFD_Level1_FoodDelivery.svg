  <line x1="470" y1="345" x2="475" y2="186" stroke="#455A64" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="382" y="258" font-size="12" fill="#37474F">New order</text>

  <line x1="495" y1="425" x2="365" y2="470" stroke="#455A64" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="360" y="452" font-size="11.5" fill="#37474F">Menu query</text>
  <line x1="612" y1="405" x2="760" y2="530" stroke="#455A64" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="670" y="470" font-size="11.5" fill="#37474F">Order record</text>

  <line x1="550" y1="441" x2="550" y2="513" stroke="#455A64" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="558" y="482" font-size="12" fill="#37474F">Order amount</text>

  <line x1="540" y1="635" x2="543" y2="700" stroke="#455A64" stroke-width="1.6" marker-end="url(#arrow)"/>
