<svg xmlns="http://www.w3.org/2000/svg" width="980" height="660" viewBox="0 0 980 660" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#455A64"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="980" height="660" fill="#FFFFFF"/>
  <rect x="0" y="0" width="980" height="52" fill="#5E35B1"/>
  <text x="490" y="33" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="bold">DFD Level 0 - Context Diagram : Online Food Delivery System</text>

  <!-- External entities (rectangles) -->
  <rect x="40" y="90" width="160" height="72" fill="#E3F2FD" stroke="#1976D2" stroke-width="2"/>
  <text x="120" y="132" text-anchor="middle" font-size="16" font-weight="bold" fill="#0D47A1">Customer</text>
  <rect x="40" y="500" width="160" height="72" fill="#E3F2FD" stroke="#1976D2" stroke-width="2"/>
  <text x="120" y="542" text-anchor="middle" font-size="16" font-weight="bold" fill="#0D47A1">Restaurant</text>
  <rect x="780" y="90" width="160" height="72" fill="#E3F2FD" stroke="#1976D2" stroke-width="2"/>
  <text x="860" y="124" text-anchor="middle" font-size="16" font-weight="bold" fill="#0D47A1">Delivery</text>
  <text x="860" y="146" text-anchor="middle" font-size="16" font-weight="bold" fill="#0D47A1">Agent</text>
  <rect x="780" y="500" width="160" height="72" fill="#E3F2FD" stroke="#1976D2" stroke-width="2"/>
  <text x="860" y="534" text-anchor="middle" font-size="16" font-weight="bold" fill="#0D47A1">Payment</text>
  <text x="860" y="556" text-anchor="middle" font-size="16" font-weight="bold" fill="#0D47A1">Gateway</text>

  <!-- Central process (CIRCLE / bubble) -->
  <circle cx="485" cy="325" r="95" fill="#EDE7F6" stroke="#5E35B1" stroke-width="2.5"/>
  <text x="485" y="303" text-anchor="middle" font-size="15" font-weight="bold" fill="#4527A0">0</text>
  <text x="485" y="326" text-anchor="middle" font-size="15" font-weight="bold" fill="#4527A0">Online Food</text>
  <text x="485" y="348" text-anchor="middle" font-size="15" font-weight="bold" fill="#4527A0">Delivery System</text>

  <!-- Customer flows -->
  <line x1="200" y1="120" x2="395" y2="275" stroke="#455A64" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="245" y="182" font-size="12.5" fill="#37474F">Order &amp; payment details</text>
  <line x1="405" y1="290" x2="205" y2="150" stroke="#455A64" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="212" y="250" font-size="12.5" fill="#37474F">Confirmation &amp; status</text>

  <!-- Restaurant flows -->
  <line x1="200" y1="515" x2="398" y2="368" stroke="#455A64" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="232" y="470" font-size="12.5" fill="#37474F">Menu &amp; food status</text>
  <line x1="405" y1="385" x2="205" y2="528" stroke="#455A64" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="220" y="408" font-size="12.5" fill="#37474F">Order details</text>

  <!-- Delivery Agent flows -->
  <line x1="568" y1="278" x2="780" y2="120" stroke="#455A64" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="605" y="185" font-size="12.5" fill="#37474F">Delivery assignment</text>
  <line x1="780" y1="150" x2="572" y2="300" stroke="#455A64" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="635" y="252" font-size="12.5" fill="#37474F">Delivery status</text>

  <!-- Payment Gateway flows -->
  <line x1="568" y1="368" x2="780" y2="528" stroke="#455A64" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="608" y="470" font-size="12.5" fill="#37474F">Payment request</text>
  <line x1="785" y1="508" x2="574" y2="350" stroke="#455A64" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="622" y="405" font-size="12.5" fill="#37474F">Payment confirmation</text>

  <!-- Legend -->
  <rect x="40" y="600" width="26" height="18" fill="#E3F2FD" stroke="#1976D2"/>
  <text x="74" y="614" font-size="12.5" fill="#37474F">External Entity</text>
  <circle cx="223" cy="609" r="10" fill="#EDE7F6" stroke="#5E35B1"/>
  <text x="240" y="614" font-size="12.5" fill="#37474F">Process</text>
</svg>
