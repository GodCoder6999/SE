<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="740" viewBox="0 0 1180 740" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#455A64"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1180" height="740" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1180" height="52" fill="#5E35B1"/>
  <text x="590" y="33" text-anchor="middle" fill="#FFFFFF" font-size="21" font-weight="bold">DFD Level 2 : Explosion of Process 3.0 - Issue Book</text>

  <!-- External entities -->
  <rect x="30" y="300" width="130" height="80" fill="#E3F2FD" stroke="#1976D2" stroke-width="2"/>
  <text x="95" y="346" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D47A1">Member</text>

  <rect x="985" y="420" width="140" height="74" fill="#E3F2FD" stroke="#1976D2" stroke-width="2"/>
  <line x1="985" y1="420" x2="999" y2="434" stroke="#1976D2" stroke-width="2"/>
  <text x="1055" y="463" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D47A1">Member</text>

  <rect x="980" y="120" width="150" height="66" fill="#E3F2FD" stroke="#1976D2" stroke-width="2"/>
  <text x="1055" y="158" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D47A1">Librarian</text>

  <!-- Sub-processes -->
  <circle cx="300" cy="180" r="58" fill="#EDE7F6" stroke="#5E35B1" stroke-width="2.2"/>
  <text x="300" y="167" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4527A0">3.1</text>
  <text x="300" y="186" text-anchor="middle" font-size="12" font-weight="bold" fill="#4527A0">Verify</text>
  <text x="300" y="202" text-anchor="middle" font-size="12" font-weight="bold" fill="#4527A0">Membership</text>

  <circle cx="300" cy="440" r="58" fill="#EDE7F6" stroke="#5E35B1" stroke-width="2.2"/>
  <text x="300" y="427" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4527A0">3.2</text>
  <text x="300" y="446" text-anchor="middle" font-size="12" font-weight="bold" fill="#4527A0">Check</text>
  <text x="300" y="462" text-anchor="middle" font-size="12" font-weight="bold" fill="#4527A0">Availability</text>

  <circle cx="620" cy="320" r="62" fill="#EDE7F6" stroke="#5E35B1" stroke-width="2.2"/>
  <text x="620" y="314" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4527A0">3.3</text>
  <text x="620" y="333" text-anchor="middle" font-size="12" font-weight="bold" fill="#4527A0">Record Issue</text>

  <circle cx="890" cy="320" r="60" fill="#EDE7F6" stroke="#5E35B1" stroke-width="2.2"/>
  <text x="890" y="307" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4527A0">3.4</text>
  <text x="890" y="326" text-anchor="middle" font-size="12" font-weight="bold" fill="#4527A0">Generate</text>
  <text x="890" y="342" text-anchor="middle" font-size="12" font-weight="bold" fill="#4527A0">Issue Slip</text>

  <!-- Data stores -->
  <g stroke="#F9A825" stroke-width="2">
    <line x1="230" y1="40" x2="420" y2="40"/><line x1="230" y1="82" x2="420" y2="82"/>
    <line x1="230" y1="40" x2="230" y2="82"/><line x1="262" y1="40" x2="262" y2="82"/>
  </g>
  <text x="246" y="66" text-anchor="middle" font-size="12" font-weight="bold" fill="#E65100">D1</text>
  <text x="343" y="66" text-anchor="middle" font-size="13" fill="#E65100">Member DB</text>

  <g stroke="#F9A825" stroke-width="2">
    <line x1="540" y1="560" x2="740" y2="560"/><line x1="540" y1="602" x2="740" y2="602"/>
    <line x1="540" y1="560" x2="540" y2="602"/><line x1="572" y1="560" x2="572" y2="602"/>
  </g>
  <text x="556" y="586" text-anchor="middle" font-size="12" font-weight="bold" fill="#E65100">D2</text>
  <text x="660" y="586" text-anchor="middle" font-size="12.5" fill="#E65100">Book Catalog</text>

  <g stroke="#F9A825" stroke-width="2">
    <line x1="700" y1="50" x2="900" y2="50"/><line x1="700" y1="92" x2="900" y2="92"/>
    <line x1="700" y1="50" x2="700" y2="92"/><line x1="732" y1="50" x2="732" y2="92"/>
  </g>
  <text x="716" y="76" text-anchor="middle" font-size="12" font-weight="bold" fill="#E65100">D3</text>
  <text x="818" y="76" text-anchor="middle" font-size="13" fill="#E65100">Issue DB</text>

  <!-- Member -> 3.1 -->
  <line x1="160" y1="320" x2="250" y2="222" stroke="#455A64" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="120" y="262" font-size="11.5" fill="#37474F">Borrow request</text>

  <!-- 3.1 <-> D1 -->
  <line x1="312" y1="123" x2="322" y2="84" stroke="#455A64" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="318" y="112" font-size="11" fill="#37474F">Member query</text>
  <line x1="345" y1="84" x2="330" y2="124" stroke="#455A64" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="352" y="112" font-size="11" fill="#37474F">Status</text>

  <!-- 3.1 -> 3.2 -->
  <line x1="300" y1="238" x2="300" y2="380" stroke="#455A64" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="308" y="315" font-size="11.5" fill="#37474F">Valid member + book id</text>

  <!-- 3.2 <-> D2 -->
  <line x1="345" y1="470" x2="558" y2="558" stroke="#455A64" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="380" y="500" font-size="11" fill="#37474F">Availability query</text>
  <line x1="575" y1="558" x2="360" y2="475" stroke="#455A64" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="430" y="545" font-size="11" fill="#37474F">Book status</text>

  <!-- 3.2 -> 3.3 -->
  <line x1="354" y1="420" x2="560" y2="346" stroke="#455A64" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="400" y="405" font-size="11.5" fill="#37474F">Available book</text>

  <!-- Librarian -> 3.3 -->
  <line x1="975" y1="150" x2="684" y2="296" stroke="#455A64" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="770" y="210" font-size="11.5" fill="#37474F">Approve issue</text>

  <!-- 3.3 -> D3 -->
  <line x1="660" y1="268" x2="796" y2="94" stroke="#455A64" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="690" y="180" font-size="11.5" fill="#37474F">Issue record</text>

  <!-- 3.3 -> D2 update stock -->
  <line x1="625" y1="382" x2="632" y2="558" stroke="#455A64" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="638" y="480" font-size="11.5" fill="#37474F">Update stock</text>

  <!-- 3.3 -> 3.4 -->
  <line x1="682" y1="320" x2="828" y2="320" stroke="#455A64" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="700" y="310" font-size="11.5" fill="#37474F">Issue details</text>

  <!-- 3.4 -> Member(R) -->
  <line x1="935" y1="359" x2="990" y2="428" stroke="#455A64" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="940" y="405" font-size="11.5" fill="#37474F">Issue slip &amp; due date</text>

  <!-- Legend -->
  <rect x="30" y="670" width="26" height="18" fill="#E3F2FD" stroke="#1976D2"/>
  <text x="64" y="684" font-size="12" fill="#37474F">External Entity</text>
  <circle cx="205" cy="679" r="10" fill="#EDE7F6" stroke="#5E35B1"/>
  <text x="222" y="684" font-size="12" fill="#37474F">Process</text>
  <g stroke="#F9A825" stroke-width="2">
    <line x1="310" y1="670" x2="350" y2="670"/><line x1="310" y1="688" x2="350" y2="688"/>
    <line x1="310" y1="670" x2="310" y2="688"/><line x1="320" y1="670" x2="320" y2="688"/>
  </g>
  <text x="358" y="684" font-size="12" fill="#37474F">Data Store</text>
  <text x="470" y="684" font-size="12" fill="#37474F">Corner slash = same entity drawn twice</text>
</svg>
